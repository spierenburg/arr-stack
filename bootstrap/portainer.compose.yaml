# Portainer itself: the ONE thing deployed by hand, once (docs/01-host-prep.md).
# It can't be a Git stack it manages, because redeploying itself would cut its own connection.
#
#   docker network create proxy
#   DOMAIN=home.arpa docker compose -f bootstrap/portainer.compose.yaml up -d
#
# Updating Portainer = bump the digest here (Renovate PR), then re-run the command above.

services:
  portainer:
    image: portainer/portainer-ce:lts@sha256:03f94a406496dc84d37b552795fc424ccad8d0d7200353b6a82915f6e8f73ab0
    container_name: portainer
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "9443:9443" # direct access with a self-signed cert, works even if Traefik is down
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN:-home.arpa}`)
      - traefik.http.services.portainer.loadbalancer.server.port=9000

volumes:
  portainer_data:

networks:
  proxy:
    external: true
